# ---------------------------------------------------------------
# Instellingen van de website
# ---------------------------------------------------------------
# Praktijkgegevens (telefoon, adres, openingstijden) staan in
# _data/praktijk.yml. Het menu staat in _data/menu.yml.

title: Huisartsenpraktijk Smits & Canoy
description: >-
  Huisartsenpraktijk Smits & Canoy in Hardinxveld-Giessendam. Professioneel,
  persoonlijk en met begrip voor uw wensen.
lang: nl

# Op GitHub Pages staat de site onder https://<gebruikersnaam>.github.io/<repository>/
# Zet hier de naam van de repository, met een schuine streep ervoor.
# Koppel je later een eigen domein (bijv. www.smitscanoy.nl)? Maak dit dan leeg: baseurl: ""
baseurl: "/smitscanoy-"
url: ""

# Testversie: false = Google en andere zoekmachines nemen de site niet op,
# zodat alleen mensen met de link hem vinden. Gaat de site officieel live?
# Zet dit dan op true.
zichtbaar_in_zoekmachines: false

permalink: pretty
timezone: Europe/Amsterdam
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /nieuws/:title/

exclude:
  - README.md
  - HANDLEIDING.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
  - .claude
  - Fotos
