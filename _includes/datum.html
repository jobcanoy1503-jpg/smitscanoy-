{%- assign maanden = "januari,februari,maart,april,mei,juni,juli,augustus,september,oktober,november,december" | split: "," -%}
{%- assign m = include.datum | date: "%-m" | minus: 1 -%}
<time datetime="{{ include.datum | date: '%Y-%m-%d' }}">{{ include.datum | date: "%-d" }} {{ maanden[m] }} {{ include.datum | date: "%Y" }}</time>
